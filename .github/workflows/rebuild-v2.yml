name: Rebuild geography v2

on:
  push:
    branches: ["main"]
    paths:
      - ".rebuild/**"
      - ".github/workflows/rebuild-v2.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact application files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .rebuild/app.js.gz.b64 | gunzip > app.js
          base64 -d .rebuild/geography.js.gz.b64 | gunzip > data/geography.js
          node --check app.js
          node --check data/geography.js
          rm -rf .rebuild
          rm -f .github/workflows/rebuild-v2.yml
      - name: Commit reconstructed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild accurate geography learning engine"
          git push origin main
